[package]
name = "meeting-asr-desktop"
version = "0.1.0-alpha"
description = "Voxly — Local Voice Workspace"
authors = ["SkyBridgeM"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
keyring = "4.1.4"
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
