name: Parity Validation

on:
  pull_request:
    paths:
      - "scripts/parity/**"
      - "tests/parity/**"
      - "docs/parity/**"
      - ".github/workflows/parity.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/parity/**"
      - "tests/parity/**"
      - "docs/parity/**"
      - ".github/workflows/parity.yml"

permissions:
  contents: read

jobs:
  offline-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/parity -v
      - run: python -m py_compile scripts/parity/parity_compare.py scripts/parity/run_parity.py tests/parity/test_parity_compare.py
