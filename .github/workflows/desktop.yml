name: Desktop Readiness

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "desktop/src-tauri/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "desktop/src-tauri/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "core-go/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    name: Offline desktop readiness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build desktop frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Diagnose macOS and Go
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOPATH: ${{ runner.temp }}/go
          GOTOOLCHAIN: local
        run: |
          rm -rf "$GOCACHE"
          mkdir -p "$GOCACHE" "$GOPATH"
          sw_vers
          uname -a
          go version
          go env GOOS GOARCH GOTOOLCHAIN GOROOT GOPATH GOCACHE
      - name: Check Go core
        working-directory: core-go
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOPATH: ${{ runner.temp }}/go
          GOTOOLCHAIN: local
        run: |
          go test ./...
          go vet ./...

      - name: Build Go desktop sidecar
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOPATH: ${{ runner.temp }}/go
          GOTOOLCHAIN: local
        run: ./scripts/build_desktop_sidecar.sh
      - name: Smoke-test Go desktop sidecar
        run: |
          sidecar="$(find desktop/src-tauri/binaries -maxdepth 1 -type f -name 'meeting-asr-go-*' -print -quit)"
          test -n "$sidecar"
          test -x "$sidecar"
          "$sidecar" version
      - name: Verify Tauri sidecar normalization
        working-directory: desktop/src-tauri
        run: |
          cargo build
          test -x target/debug/meeting-asr-go
          normalized_suffix="$(find target/debug -maxdepth 1 -type f -name 'meeting-asr-go-*' -print -quit)"
          test -z "$normalized_suffix"
          target/debug/meeting-asr-go version
      - name: Internal macOS app-bundle smoke
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOPATH: ${{ runner.temp }}/go
          GOTOOLCHAIN: local
        run: ./scripts/smoke_desktop_app_bundle.sh

      - name: Check Rust desktop code
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo test --release
          cargo clippy -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check Python regression suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Check diff whitespace
        run: git diff --check
