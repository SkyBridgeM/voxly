name: Go Core

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core-go/**"
      - ".github/actions/setup-go-toolchain/**"
      - ".github/workflows/go-core.yml"
  push:
    branches:
      - main
    paths:
      - "core-go/**"
      - ".github/actions/setup-go-toolchain/**"
      - ".github/workflows/go-core.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Go test and vet
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-go
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-toolchain
        with:
          cache: "true"
          cache-dependency-path: core-go/go.sum
      - run: go test ./...
      - run: go vet ./...

  extended:
    name: Go extended readiness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-go
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-toolchain
        with:
          cache: "true"
          cache-dependency-path: core-go/go.sum
      - run: go test -race ./...
      - name: Compile macOS tests
        run: GOOS=darwin GOARCH=arm64 go test -c -o /tmp/meeting-asr-go-darwin.test .
      - name: Compile Linux tests
        run: GOOS=linux GOARCH=amd64 go test -c -o /tmp/meeting-asr-go-linux.test .
      - name: Compile Windows tests
        run: GOOS=windows GOARCH=amd64 go test -c -o /tmp/meeting-asr-go-windows.test.exe .
